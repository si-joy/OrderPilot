<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Access Denied | OrderPilot
    </title>

    <style>
        :root {
            --bg: #f7f8fa;
            --surface: #ffffff;
            --text: #111827;
            --muted: #6b7280;
            --border: #e5e7eb;
            --primary: #2563eb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: grid;
            place-items: center;

            padding: 24px;

            font-family:
                Inter,
                system-ui,
                -apple-system,
                sans-serif;

            background: var(--bg);
            color: var(--text);
        }

        .error-card {
            width: min(100%, 520px);

            padding: 40px 28px;

            text-align: center;

            border: 1px solid var(--border);
            border-radius: 18px;

            background: var(--surface);
        }

        .error-code {
            margin: 0;

            font-size: 54px;
            line-height: 1;

            font-weight: 800;
        }

        h1 {
            margin: 18px 0 8px;

            font-size: 24px;
        }

        p {
            margin: 0 0 24px;

            color: var(--muted);

            line-height: 1.6;
        }

        a {
            display: inline-flex;

            padding: 11px 18px;

            border-radius: 10px;

            color: #ffffff;
            background: var(--primary);

            text-decoration: none;

            font-weight: 600;
        }

        @media (prefers-color-scheme: dark) {

            :root {
                --bg: #0b0f19;
                --surface: #111827;
                --text: #f9fafb;
                --muted: #9ca3af;
                --border: #263244;
            }

        }
    </style>
</head>

<body>

    <main class="error-card">

        <p class="error-code">
            403
        </p>

        <h1>
            Access Denied
        </h1>

        <p>
            You do not have permission to access this page or perform this action.
        </p>

        <a href="/">
            Back to Dashboard
        </a>

    </main>

</body>
</html>
