{% load static %}

<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        OrderPilot
        {% endblock %}
    </title>


    <script>
        (function () {
            const savedTheme =
                localStorage.getItem("orderpilot-theme");

            const prefersDark =
                window.matchMedia(
                    "(prefers-color-scheme: dark)"
                ).matches;

            if (
                savedTheme === "dark"
                ||
                (!savedTheme && prefersDark)
            ) {
                document
                    .documentElement
                    .classList
                    .add("dark");
            }
        })();
    </script>


    <link
        rel="stylesheet"
        href="{% static 'css/app.css' %}"
    >

</head>


<body>

    <div class="auth-shell">

        <div class="auth-card">

            <div class="auth-brand">

                <div class="brand-mark">
                    OP
                </div>

                <div>

                    <div class="brand-name">
                        OrderPilot
                    </div>

                    <div class="brand-subtitle">
                        Seller Management
                    </div>

                </div>

            </div>


            {% if messages %}

                {% for message in messages %}

                    <div
                        class="
                            alert
                            {% if message.tags == 'error' %}
                                alert-danger
                            {% elif message.tags %}
                                alert-{{ message.tags }}
                            {% endif %}
                        "
                    >
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}


            {% block content %}
            {% endblock %}

        </div>

    </div>


    <script
        src="{% static 'js/app.js' %}"
    ></script>

</body>

</html>
