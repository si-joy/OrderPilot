<div class="form-group">

    {% if label %}
        <label
            for="{{ field.id_for_label }}"
            class="form-label"
        >
            {{ label }}

            {% if required %}
                <span class="required">*</span>
            {% endif %}
        </label>
    {% endif %}

    {{ field }}

    {% if help_text %}
        <div class="form-help">
            {{ help_text }}
        </div>
    {% endif %}

    {% if field.errors %}
        <div class="form-error">
            {{ field.errors|striptags }}
        </div>
    {% endif %}

</div>
